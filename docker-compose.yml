services:
  nginx:
    image: nginx:alpine
    container_name: datsan247_web_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
    networks:
      - datsan_network

  web:
    image: ${DOCKERHUB_USERNAME:-datsan247}/datsan247-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datsan247_web
    expose:
      - "3000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - datsan_network

networks:
  datsan_network:
    driver: bridge

volumes:
  nginx_cache:
